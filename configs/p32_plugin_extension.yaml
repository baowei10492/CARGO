           WHU-CD: configs/p32_plugins/snunet_f1.yaml}
  bifa: {LEVIR-CD: configs/p32_plugins/bifa_f1.yaml, DSIFN-CD: configs/p32_plugins/bifa_f1.yaml,
         WHU-CD: configs/p32_plugins/bifa_f1.yaml}
