# P29: the DINOv3 detector of the P27 DSIFN row (configs/p15_dsifn_p3b.yaml) retrained from the
# same initialization with the same recipe, plus test-matched misalignment augmentation.
# Only experiment.name, the augmentation keys differ.
experiment:
  name: p29_dinov3_aug_dsifn
  seed: 3407
  output_root: outputs

# Gate 1 of docs/P15_DSIFN_SECOND_POSITIVE_PROTOCOL.md.
# The P3b recipe is held fixed from LEVIR. The 512 px image geometry uses
# the already established WHU batch-size recipe. The leakage-free
# source-crop split from Gate -1 is mandatory.
data:
  dataset_root: /root/autodl-tmp/rs_cd_work/data/DSIFN-CD/DSIFN
  manifest: manifests/datasets/dsifn_cd_source_split.csv
  train_split: train
  val_split: val
  test_split: test
  train_crop_size: 256
  eval_crop_size: null
  num_workers: 8
  prefetch_factor: 4
  cache_mode: none
  normalization: imagenet
  # DSIFN-CD masks are encoded as 0/1, not 0/255.
  mask_threshold: 0
  train_flip: true
  train_rotate90: true
  positive_crop_probability: 0.7
  positive_crop_min_pixels: 64
  positive_crop_trials: 8
  # P29 augmentation baseline (docs/P29_AUGMENTATION_BASELINE.md): T2 perturbed like
  # the P27 test levels (configs/p27_eval_perturbation.yaml, no rotation) in 75% of the
  # training crops, level 1-3 uniformly; pixels without T2 content are left out of the loss.
  affine_misregistration_probability: 0.75
  affine_max_translation_px: 25.0
  affine_scale_range: [0.80, 1.25]
  affine_levels: 3

model:
  name: dinov3_convnext_cd
  backbone_name: convnext_tiny.dinov3_lvd1689m
  pretrained: true
  checkpoint_path: /root/autodl-tmp/rs_cd_work/pretrained/DINOv3/convnext_tiny.dinov3_lvd1689m
  freeze_backbone: false
  trainable_stages: 2
  decoder_channels: 128
  in_channels: 3

loss:
  bce_weight: 1.0
  dice_weight: 1.0
  pos_weight: 2.0

training:
  epochs: 40
  samples_per_epoch: 8192
  batch_size: 32
  learning_rate: 0.0003
  backbone_learning_rate: 0.00002
  weight_decay: 0.0001
  amp: true
  allow_tf32: true
  deterministic: false
  grad_clip_norm: 1.0
  checkpoint_interval: 5
  log_interval: 20
  initial_checkpoint: null

evaluation:
  batch_size: 8
  threshold: 0.5
  validation_interval: 5
  save_predictions: false
