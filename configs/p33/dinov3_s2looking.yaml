# P33 (docs/P33_REVIEWER_EXPERIMENTS.md): the DINOv3 detector of the paper (configs/p3b_dinov3_convnext_tiny_partial_ft.yaml,
# same recipe: 40 epochs x 8192 crops, batch 8, BCE + Dice with positive weight 2, checkpoint by unperturbed
# validation F1) trained on S2Looking, a dataset the registration module never saw. Only experiment.name and the
# data block (S2Looking paths, as configs/p6_s2looking_dinov3_partial_ft.yaml) differ.
experiment:
  name: p33_dinov3_s2looking
  seed: 3407
  output_root: outputs

data:
  dataset_root: /root/autodl-tmp/rs_cd_work/data/S2Looking
  manifest: manifests/datasets/s2looking.csv
  train_split: train
  val_split: val
  test_split: test
  train_crop_size: 256
  eval_crop_size: null
  num_workers: 8
  prefetch_factor: 4
  cache_mode: ram
  normalization: imagenet
  mask_threshold: 127
  train_flip: true
  train_rotate90: true
  positive_crop_probability: 0.7
  positive_crop_min_pixels: 64
  positive_crop_trials: 8

model:
  name: dinov3_convnext_cd
  backbone_name: convnext_tiny.dinov3_lvd1689m
  pretrained: true
  checkpoint_path: /root/autodl-tmp/rs_cd_work/pretrained/DINOv3/convnext_tiny.dinov3_lvd1689m
  freeze_backbone: false
  trainable_stages: 2
  decoder_channels: 128
  in_channels: 3

loss:
  bce_weight: 1.0
  dice_weight: 1.0
  pos_weight: 2.0

training:
  epochs: 40
  samples_per_epoch: 8192
  batch_size: 8
  learning_rate: 0.0003
  backbone_learning_rate: 0.00002
  weight_decay: 0.0001
  amp: true
  allow_tf32: true
  deterministic: false
  grad_clip_norm: 1.0
  checkpoint_interval: 5
  log_interval: 20
  initial_checkpoint: null

evaluation:
  batch_size: 2
  threshold: 0.5
  validation_interval: 5
  save_predictions: true
