experiment:
  name: p17_gzcd_fullres_calibration
  seed: 3407
  output_root: outputs

# Gate 2 stage two: calibrate only the shiftedness head at full tile
# resolution, with the offset localizer frozen. Recipe copied from the
# LEVIR P7-1C config; only the data section changes.

data:
  dataset_root: /root/autodl-tmp/rs_cd_work/data/GZ-CD-tiles
  manifest: manifests/datasets/gzcd.csv
  train_split: train
  val_split: val
  test_split: test
  train_crop_size: null
  eval_crop_size: null
  num_workers: 4
  prefetch_factor: 2
  cache_mode: ram
  normalization: imagenet
  mask_threshold: 127
  train_flip: true
  train_rotate90: true
  positive_crop_probability: 0.0
  positive_crop_min_pixels: 64
  positive_crop_trials: 8
  misregistration_probability: 0.5
  misregistration_pixels: [2, 4, 8]
  misregistration_target: t2

model:
  name: dinov3_task_aware_input_registration_cd
  backbone_name: convnext_tiny.dinov3_lvd1689m
  pretrained: true
  checkpoint_path: /root/autodl-tmp/rs_cd_work/pretrained/DINOv3/convnext_tiny.dinov3_lvd1689m
  decoder_channels: 128
  descriptor_channels: 32
  search_radius: 4
  top_fraction: 0.25
  initial_local_logit_scale: 10.0
  initial_global_logit_scale: 5.0
  surface_decoder_channels: 16
  change_exclusion_radius: 2
  decoupled_shift_decision: true
  freeze_localizer: true
  use_change_mask_for_matching: false
  skip_change_detector_during_registration: true
  offset_decoding: hard
  alignment_gate: threshold_nonzero
  zero_probability_threshold: 0.5
  registration_only: true
  freeze_registration: false
  target_distribution_sigma: 0.5
  offset_distribution_weight: 0.0
  offset_regression_weight: 0.0
  shiftedness_weight: 1.0
  clean_anchor_weight: 2.0

loss:
  bce_weight: 1.0
  dice_weight: 1.0
  pos_weight: 2.0

training:
  epochs: 8
  samples_per_epoch: 1024
  batch_size: 4
  learning_rate: 0.0005
  weight_decay: 0.0001
  amp: true
  allow_tf32: true
  deterministic: false
  grad_clip_norm: 5.0
  checkpoint_interval: 1
  keep_epoch_checkpoints: true
  log_interval: 20
  initial_checkpoint: null
  initial_checkpoint_strict: true

evaluation:
  batch_size: 1
  threshold: 0.5
  validation_interval: 2
  save_predictions: false
