# P32 stage 1: SNUNet on DSIFN-CD (docs/P32_PLUGIN_EXTENSION.md).
#
# Data: identical to the DINOv3 row on this dataset (configs/p15_dsifn_p3b.yaml), so every
# detector sees the same split, crops and positive-crop sampling.
# Optimisation: the detector's published optimizer and schedule, rescaled to
# this project's 40 x 8192 sample budget by keeping the schedule's shape
# (P21 protocol amendment A). Source: rschange configs/SNUNet.py (AdamW 1e-3, wd 1e-2,
# step decay by 0.5 every 8 of 200 epochs, so step_fraction 0.04) with the batch of the
# dataset base config (configs/_base_/DSIFN_config.py, 8), as every other P21 cell.
# Loss: BCE + Dice for every detector (project protocol, not the published
# loss). Only the nn.Module is imported from rschange.
status: preregistered
protocol_doc: docs/P32_PLUGIN_EXTENSION.md
cell: {detector: SNUNet, dataset: DSIFN-CD}

experiment:
  name: p32_snunet_dsifn
  seed: 3407
  output_root: outputs

data:
  dataset_root: /root/autodl-tmp/rs_cd_work/data/DSIFN-CD/DSIFN
  manifest: manifests/datasets/dsifn_cd_source_split.csv
  train_split: train
  val_split: val
  test_split: test
  train_crop_size: 256
  eval_crop_size: null
  num_workers: 8
  prefetch_factor: 4
  cache_mode: none
  normalization: imagenet
  # DSIFN-CD masks are encoded as 0/1, not 0/255.
  mask_threshold: 0
  train_flip: true
  train_rotate90: true
  positive_crop_probability: 0.7
  positive_crop_min_pixels: 64
  positive_crop_trials: 8

model:
  name: rschange_detector
  detector_name: SNUNet
  repo_root: /root/autodl-tmp/rs_cd_work/rschange
  backbone:
    type: UNetpp
    in_ch: 3
  decoderhead:
    type: ECAM
    out_ch: 2             # two-class head; wrapper converts to l1 - l0

loss:
  bce_weight: 1.0
  dice_weight: 1.0
  pos_weight: 2.0

training:
  epochs: 40
  samples_per_epoch: 8192
  batch_size: 8                  # published batch; only memory may lower it
  optimizer: adamw
  learning_rate: 0.001
  backbone_learning_rate: null   # one learning rate for all parameters
  weight_decay: 0.01
  scheduler: step
  step_fraction: 0.04            # 8 of 200 published epochs
  step_gamma: 0.5
  # Protocol amendment D (docs/P32_PLUGIN_EXTENSION.md, section 7): fp32, unlike
  # every other cell. rschange trains SNUNet in fp32 -- its '16-mixed' line is
  # commented out -- and under fp16 the first epoch overflowed and poisoned the
  # BatchNorm running statistics, so training and validation both returned NaN
  # from epoch 1 on. The optimizer, schedule and budget are unchanged.
  amp: false
  allow_tf32: true
  deterministic: false
  grad_clip_norm: null           # no clipping in the published recipes
  checkpoint_interval: 5
  log_interval: 20
  initial_checkpoint: null

evaluation:
  batch_size: 2
  threshold: 0.5
  validation_interval: 5
  save_predictions: false
