experiment:
  name: p17_gzcd_decoupled_stage_a
  seed: 3407
  output_root: outputs

# Gate 2 of docs/P17_GZCD_SECOND_POSITIVE_PROTOCOL.md. Item-for-item
# identical to the WHU stage-A config, which was itself declared identical
# to the proven LEVIR P7-1B recipe; only the data section changes. No
# hyperparameter is searched for GZ-CD.
#
# The preregistered absolute gates cannot be met on this dataset: main
# record 120.4 showed the oracle ceiling sits below them. This run is
# executed to measure how much of the available benefit the router
# actually captures, which is reported as a descriptive quantity and
# never as a gate.
#
# search_radius stays 4 deliberately: the whole point of this stage is a
# cross-dataset comparison against the LEVIR P7-1B numbers under the
# same gates, and radius changes the candidate count (80 vs 168) and
# therefore the difficulty of the forced choice. Prohibition #8 stands;
# boundary_fraction is reported so any radius question stays evidence
# driven and requires explicit user approval.
data:
  dataset_root: /root/autodl-tmp/rs_cd_work/data/GZ-CD-tiles
  manifest: manifests/datasets/gzcd.csv
  train_split: train
  val_split: val
  test_split: test
  train_crop_size: 256
  eval_crop_size: null
  num_workers: 8
  prefetch_factor: 4
  cache_mode: ram
  normalization: imagenet
  mask_threshold: 127
  train_flip: true
  train_rotate90: true
  positive_crop_probability: 0.7
  positive_crop_min_pixels: 64
  positive_crop_trials: 8
  misregistration_probability: 0.5
  misregistration_pixels: [2, 4, 8]
  misregistration_target: t2

model:
  name: dinov3_task_aware_input_registration_cd
  backbone_name: convnext_tiny.dinov3_lvd1689m
  pretrained: true
  checkpoint_path: /root/autodl-tmp/rs_cd_work/pretrained/DINOv3/convnext_tiny.dinov3_lvd1689m
  decoder_channels: 128
  descriptor_channels: 32
  search_radius: 4
  top_fraction: 0.25
  initial_local_logit_scale: 10.0
  initial_global_logit_scale: 5.0
  surface_decoder_channels: 16
  change_exclusion_radius: 2
  decoupled_shift_decision: true
  offset_decoding: hard
  alignment_gate: threshold_nonzero
  zero_probability_threshold: 0.5
  registration_only: true
  freeze_registration: false
  target_distribution_sigma: 0.5
  offset_distribution_weight: 1.0
  offset_regression_weight: 1.0
  shiftedness_weight: 1.0
  clean_anchor_weight: 2.0

loss:
  bce_weight: 1.0
  dice_weight: 1.0
  pos_weight: 2.0

training:
  epochs: 15
  samples_per_epoch: 8192
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.0001
  amp: true
  allow_tf32: true
  deterministic: false
  grad_clip_norm: 5.0
  checkpoint_interval: 1
  keep_epoch_checkpoints: true
  log_interval: 10
  initial_checkpoint: null
  initial_checkpoint_strict: false

evaluation:
  # GZ-CD tiles are 512 px like WHU, so the same evaluation batch size
  # applies. Forced by tile size, not by tuning.
  batch_size: 8
  threshold: 0.5
  validation_interval: 5
  save_predictions: false
